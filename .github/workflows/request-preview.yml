name: Request Qishu Preview

on:
  push:
    branches:
      - test
  workflow_dispatch:

permissions:
  contents: read

jobs:
  request-preview:
    runs-on: ubuntu-latest
    env:
      TOMZ_PREVIEW_TOKEN: ${{ secrets.TOMZ_PREVIEW_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Check publication contract readiness
        id: publication
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const publication = JSON.parse(fs.readFileSync("publication.json", "utf8"));
          const unresolved = publication.entries.filter((entry) =>
            !entry.authorship ||
            entry.authorship.status !== "resolved" ||
            !Array.isArray(entry.authorship.authors) ||
            entry.authorship.authors.length === 0
          );
          const ready = unresolved.length === 0;
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `ready=${ready ? "true" : "false"}\n`);
          if (!ready) {
            const names = unresolved.map((entry) => entry.slug || entry.source).join(", ");
            console.log(`::notice::Preview dispatch skipped: publication authorship is unresolved for ${names}`);
          }
          NODE

      - name: Dispatch preview to tomz.io
        if: steps.publication.outputs.ready == 'true' && env.TOMZ_PREVIEW_TOKEN != ''
        shell: bash
        run: |
          set -euo pipefail
          payload="$(jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg sha "$GITHUB_SHA" \
            '{event_type:"external-book-preview",client_payload:{repository:$repository,sha:$sha,stage:"preview"}}')"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TOMZ_PREVIEW_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/dangjingtao/tomz-io/dispatches \
            -d "$payload"

      - name: Explain missing cross-repo credential
        if: steps.publication.outputs.ready == 'true' && env.TOMZ_PREVIEW_TOKEN == ''
        run: |
          echo "::notice::Preview is ready, but TOMZ_PREVIEW_TOKEN is not configured. No cross-repository dispatch was attempted."
